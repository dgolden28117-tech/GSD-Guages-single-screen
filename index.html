html{position:relative;isolation:isolate}
body{position:relative;z-index:1;isolation:auto;background:transparent!important}

:root{--ui-red:#e32c49;--ui-line:rgba(195,194,210,.17);--ui-muted:#a7a7b3}
.app{max-width:1060px;padding:20px clamp(12px,3vw,28px) 45px;background:transparent!important}
.app>header{padding:12px 2px 20px;gap:16px;border-bottom:1px solid var(--ui-line);align-items:center}
.brandline{gap:15px;min-width:0}.brandlogo{width:66px;height:66px;border:1px solid rgba(255,255,255,.35);box-shadow:0 0 0 4px rgba(255,255,255,.035);object-fit:cover}
.brandname{font-size:clamp(16px,2.8vw,23px);font-weight:850;letter-spacing:2.4px;line-height:1.18}
.brandline .sub{font-size:10px;letter-spacing:1.3px;margin-top:7px;color:#b1b0ba}
.status{flex-shrink:0;border:1px solid rgba(225,169,75,.35);background:rgba(26,22,19,.75);border-radius:3px;padding:9px 11px;font-size:10px;letter-spacing:1.1px}
.sectionhead{padding:23px 2px 12px;margin:0;align-items:baseline}.sectionhead strong{font-size:13px;letter-spacing:2.1px}.sectionhead .micro{font-size:10px;letter-spacing:1.1px}
.gauges{gap:clamp(5px,1.6vw,15px);align-items:stretch}
.gauge{position:relative;overflow:hidden;background:linear-gradient(155deg,rgba(27,27,33,.94),rgba(7,7,11,.96));border:1px solid rgba(159,151,171,.28);border-radius:9px;padding:clamp(3px,.9vw,10px) clamp(2px,.6vw,8px) 13px;box-shadow:0 8px 22px rgba(0,0,0,.3);transition:border-color .18s,box-shadow .18s}
.gauge:hover{border-color:rgba(198,163,234,.56)}
.gauge.active{border-color:rgba(235,65,95,.85);box-shadow:0 0 0 1px rgba(235,65,95,.22),inset 0 -3px var(--ui-red),0 8px 25px rgba(0,0,0,.32)}
.gauge canvas{max-width:100%;height:auto;aspect-ratio:1;position:relative;z-index:1}
.gauge small{display:block;margin:4px 0 0;font-size:10px;letter-spacing:2px;font-weight:800;color:#d4d0d9}
.tabs{position:sticky;top:0;z-index:20;margin-top:24px;padding:0 12px;gap:clamp(12px,3.6vw,35px);background:rgba(11,11,16,.96);border:1px solid var(--ui-line);border-bottom:1px solid rgba(218,215,225,.26);border-radius:7px 7px 0 0;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:50px;white-space:nowrap;padding:15px 3px 13px;letter-spacing:1.45px;font-size:11px}
.tabs button.active{color:#fff;border-bottom-color:var(--ui-red)}
.panel{min-height:290px;padding:23px clamp(14px,3vw,26px) 26px;background:rgba(11,12,17,.91);border:1px solid var(--ui-line);border-top:0;border-radius:0 0 8px 8px;box-shadow:0 16px 40px rgba(0,0,0,.22)}
.panel .title{font-size:15px;letter-spacing:1.3px}
.panel .field{border-top-color:rgba(199,195,208,.15)}
.panel select,.panel input[type=number]{border-radius:5px;background:#171820;border-color:#41414d}
.panel button.action{border-radius:5px;min-height:42px}
.footer{padding:24px 2px 8px;margin-top:10px;color:#85838f;font-size:10px;letter-spacing:1px;gap:12px}
@media(max-width:600px){.app{padding:12px 10px 35px}.app>header{padding:9px 3px 15px;gap:7px}.brandline{gap:10px}.brandlogo{width:50px;height:50px}.brandname{font-size:15px;letter-spacing:1.3px}.brandline .sub{font-size:8px;letter-spacing:.65px;line-height:1.4}.status{font-size:8px;padding:7px 6px;letter-spacing:.4px}.sectionhead{padding:20px 2px 10px}.sectionhead strong{font-size:11px}.sectionhead .micro{font-size:8px;letter-spacing:.4px}.gauge{border-radius:6px;padding:3px 1px 10px}.gauge small{font-size:9px;letter-spacing:1px;margin-top:2px}.tabs{padding:0 10px;gap:22px;margin-top:18px}.tabs button{font-size:10px;min-height:47px}.panel{padding:19px 14px 24px}.footer{font-size:8px;letter-spacing:.4px}}
@media(max-width:360px){.brandname{font-size:13px}.status{font-size:7px}.gauge small{font-size:8px}.sectionhead .micro{font-size:7px}}
@media(prefers-reduced-motion:reduce){.gauge{transition:none}}

.shared-color-field .custom-color-row input[type="color"],
.shared-color-field .custom-color-row input[type="color"]#all-text-custom {
  appearance:none!important;-webkit-appearance:none!important;
  box-sizing:border-box!important;
  width:82px!important;min-width:82px!important;max-width:82px!important;
  height:52px!important;min-height:52px!important;
  padding:0!important;margin:0!important;border:0!important;
  border-radius:0!important;background:transparent!important;
  clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);
  cursor:pointer;flex:0 0 82px!important;
}
.shared-color-field .custom-color-row input[type="color"]::-webkit-color-swatch-wrapper {padding:0!important;}
.shared-color-field .custom-color-row input[type="color"]::-webkit-color-swatch {border:0!important;border-radius:0!important;}
.shared-color-field .custom-color-row input[type="color"]::-moz-color-swatch {border:0!important;border-radius:0!important;}

.split-assignment-disabled{opacity:.42;}
.split-assignment-disabled select{cursor:not-allowed!important;filter:grayscale(1);}

.display-settings-header{padding:0 0 12px;margin:0 0 10px}
.display-settings-header .title{font-size:clamp(19px,5vw,26px);letter-spacing:1px}
.display-color-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px 0 18px;align-items:start}
.display-color-option{min-width:0;gap:10px}
.display-hex-border{position:relative!important;width:min(100%,108px)!important;height:68px!important;aspect-ratio:auto!important;box-sizing:border-box!important;padding:0!important;background:#000!important;clip-path:polygon(24% 0,76% 0,100% 50%,76% 100%,24% 100%,0 50%)!important;overflow:hidden!important}
.display-hex-border::before{content:"";position:absolute;inset:5px;background:var(--swatch-color,#fff);clip-path:polygon(24% 0,76% 0,100% 50%,76% 100%,24% 100%,0 50%);pointer-events:none}
.display-hex-border input[type=color]{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:0!important;cursor:pointer!important;z-index:2!important}
.display-color-option>label{font-size:clamp(9px,2.4vw,12px)!important;letter-spacing:0!important;line-height:1.2!important}
@media(max-width:400px){.display-hex-border{width:min(100%,98px)!important;height:62px!important}}

/* GSD subtle charcoal carbon-fiber weave across the control panel.
   CSS-only texture: no external assets, no changes to gauge canvas or startup. */
.app{
  background-color:rgba(8,9,11,.65)!important;
  background-image:
    repeating-linear-gradient(45deg,rgba(160,166,178,.045) 0px,rgba(160,166,178,.045) 1px,transparent 1px,transparent 5px),
    repeating-linear-gradient(-45deg,rgba(160,166,178,.035) 0px,rgba(160,166,178,.035) 1px,transparent 1px,transparent 5px)!important;
}
.panel{
  background-color:rgba(10,11,15,.96)!important;

window.gsdMakeOemHexPattern=function(color,intensity){
 const im=window.gsdOemHexImage;if(!im.complete||!im.naturalWidth)return null;
 const key=color+':'+intensity.toFixed(3),cache=window.gsdOemHexCache;
 if(cache.key===key)return cache.canvas;
 const cv=document.createElement('canvas');cv.width=im.naturalWidth;cv.height=im.naturalHeight;
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(im,0,0);
 const pixels=cx.getImageData(0,0,cv.width,cv.height),d=pixels.data;
 const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
 for(let i=0;i<d.length;i+=4){
  // Retain the photograph's luminance and shading, change its violet chroma.
  const light=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];
  const detail=Math.pow(Math.max(0,Math.min(1,(light-8)/78)),1.15);
  const power=.25+.75*intensity;
  d[i]=Math.min(255,3+light*.13+r*detail*power*.92);
  d[i+1]=Math.min(255,2+light*.10+g*detail*power*.92);
  d[i+2]=Math.min(255,5+light*.15+b*detail*power*.92);

<style id="gsd-color-selector-glow">
/* Clean solid swatches with a crisp black outline and color-matched halo. */
.display-hex-border{
  overflow:visible!important;
  background:#080808!important;
  filter:drop-shadow(0 0 4px var(--swatch-color,#fff)) drop-shadow(0 0 9px var(--swatch-color,#fff))!important;
}
.display-hex-border::before{
  content:""!important;
  inset:4px!important;
  background:var(--swatch-color,#fff)!important;
  opacity:1!important;
}
.display-hex-border::after{content:none!important;display:none!important}
</style>
<style id="gsd-flat-glowing-color-selectors">
/* Visual-only refinement: original color inputs and handlers remain intact. */
.display-color-trio .display-hex-border{
  position:relative!important;isolation:isolate!important;
  overflow:visible!important;clip-path:none!important;
  background:transparent!important;padding:0!important;
  filter:drop-shadow(0 0 4px var(--swatch-color,#fff)) drop-shadow(0 0 8px var(--swatch-color,#fff))!important;
}
.display-color-trio .display-hex-border::before,
.display-color-trio .display-hex-border::after{
  content:""!important;display:block!important;position:absolute!important;
  pointer-events:none!important;opacity:1!important;
  clip-path:polygon(24% 0,76% 0,100% 50%,76% 100%,24% 100%,0 50%)!important;
}
.display-color-trio .display-hex-border::before{
  inset:0!important;background:#050505!important;z-index:0!important;
}
.display-color-trio .display-hex-border::after{
  inset:5px!important;background:var(--swatch-color,#fff)!important;
  z-index:1!important;
  filter:drop-shadow(0 0 1px #fff)!important;
}
.display-color-trio .display-hex-border input[type=color]{
  position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
  opacity:0!important;z-index:3!important;cursor:pointer!important;
}
</style><style id="gsd-single-screen-override">
/* Landscape screen: all pixels are inside the bezel; no absolute positioning against the outer stage. */
.gsd-single-stage{width:100%;display:flex;justify-content:center;align-items:center;padding:clamp(8px,2vw,22px)!important;box-sizing:border-box;background:radial-gradient(ellipse at center,#17121f,#08080b 70%);position:relative}
.gsd-device-frame{width:min(100%,680px);aspect-ratio:4/3;position:relative;box-sizing:border-box;padding:clamp(5px,1vw,9px);border:clamp(7px,1.5vw,13px) solid #202027;border-radius:clamp(12px,2vw,24px);background:#050507;box-shadow:inset 0 0 0 2px #55515e,0 10px 25px #000b}
.gsd-device-screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000;border:1px solid #3d3547;border-radius:clamp(3px,.8vw,8px);box-sizing:border-box}
.gsd-single-stage #gauges{position:absolute!important;inset:0!important;left:0!important;top:0!important;width:100%!important;height:100%!important;display:block!important;transform:none!important;margin:0!important;padding:0!important;z-index:3!important;pointer-events:auto!important}
.gsd-single-stage #gauges .gauge{display:none!important}
.gsd-single-stage #gauges .gauge:first-child{display:block!important;position:absolute!important;inset:0!important;left:0!important;top:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border-radius:0!important;transform:none!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#000!important;border:0!important;box-shadow:none!important;pointer-events:auto!important}
.gsd-single-stage #gauges .gauge:first-child canvas{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;aspect-ratio:auto!important;border-radius:0!important;object-fit:fill!important}
.gsd-single-stage #gauges .reference-face,.gsd-single-stage #gauges .gauge small,.gsd-single-stage .gsd-side-readout{display:none!important}
@media(max-width:500px){.gsd-single-stage{padding:8px 5px!important}.gsd-device-frame{border-width:7px;padding:4px;border-radius:12px}}
</style><style id="gsd-round-gauge-aspect-fix">

.gsd-single-stage #gauges .gauge:first-child canvas{width:100%!important;height:100%!important;}

const centerShamrockTint=document.createElement('canvas');let centerShamrockLastColor='';
function gauge(ctx,i,v,time){const C=150,rad=Math.PI/180,TAU=Math.PI*2;const label=state.labels[i];const base=state.colors[i]||'#a65aff';let logoColor=base;
const pt=(r,a)=>[C+Math.cos(a)*r,C+Math.sin(a)*r];
const words=(str,x,y,size=13,weight=600,italic=true)=>{ctx.save();ctx.fillStyle=state.gaugeTextColor||'#f7f4ff';ctx.shadowColor=state.gaugeTextColor||'#aaa0ba';ctx.shadowBlur=1;ctx.font=`${weight} ${size}px 'GSD Sutro',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(str),x,y);ctx.restore()};
const stroke=(r,a,b,color,w=6,glow=false)=>{ctx.save();ctx.beginPath();ctx.arc(C,C,r,a,b,a>b);ctx.lineCap='butt';
if(glow){
 // Moving luminous halo: two soft passes that follow only active sweep segments.
 ctx.save();ctx.globalCompositeOperation='screen';ctx.strokeStyle=color;
 ctx.globalAlpha*=.22;ctx.lineWidth=w+15;ctx.shadowColor=color;ctx.shadowBlur=24;ctx.stroke();
 ctx.globalAlpha*=1.7;ctx.lineWidth=w+7;ctx.shadowBlur=12;ctx.stroke();ctx.restore();
}
ctx.lineWidth=w+2;ctx.strokeStyle='#100d17';ctx.stroke();ctx.lineWidth=w;ctx.strokeStyle=color;
ctx.shadowColor=glow?color:'transparent';ctx.shadowBlur=glow?10:0;ctx.stroke();ctx.shadowBlur=0;
ctx.lineWidth=Math.max(1.3,w*.28);ctx.strokeStyle='rgba(255,255,255,.72)';ctx.globalAlpha*=glow?.72:.13;
ctx.beginPath();ctx.arc(C,C,r-1,a,b,a>b);ctx.stroke();ctx.restore()};
const tick=(a,major)=>{let [x,y]=pt(104,a),[xx,yy]=pt(major?113:109,a);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.strokeStyle=major?(state.gaugeTextColor||'#f7f4ff'):'#b0a6bc';ctx.lineWidth=major?1.6:.7;ctx.stroke()};
const mark=(s,r,a,size=11)=>{let [x,y]=pt(r,a);words(s,x,y,size*1.2,550)};
const mixColor=(a,b,t)=>{t=clamp(t,0,1);const x=a.replace('#',''),y=b.replace('#','');const rgb=k=>parseInt(k,16);return '#'+[0,2,4].map(n=>Math.round(rgb(x.slice(n,n+2))*(1-t)+rgb(y.slice(n,n+2))*t).toString(16).padStart(2,'0')).join('')};
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const afrColor=p=>{const low=+state.afrLow,high=+state.afrHigh;const deviation=Math.max(low-p,p-high);return mixColor(mixColor(base,'#ffbe39',smooth(-.55,.12,deviation)),'#ff354d',smooth(.05,.75,deviation))};

function startupGauge(ctx,i,elapsed,v,time){
 const t=elapsed/1000, C=150, TAU=Math.PI*2;
 const clamp01=x=>Math.max(0,Math.min(1,x));
 const smooth=x=>{x=clamp01(x);return x*x*(3-2*x)};
 const ease=(a,b)=>smooth((t-a)/(b-a));
 const circle=(radius=122)=>{ctx.beginPath();ctx.arc(C,C,radius,0,TAU);};
 function blackFace(){
  ctx.clearRect(0,0,300,300);
  if(referenceFaces[i].complete&&referenceFaces[i].naturalWidth)ctx.drawImage(referenceFaces[i],0,0,300,300);
  ctx.save();circle();ctx.clip();ctx.fillStyle='#000';ctx.fillRect(0,0,300,300);ctx.restore();
 }
 // Treat the three 300px canvases as one 900px-wide illuminated display.
 // The same global coordinates are drawn in each screen's clipped viewport.
 function sharedViewport(draw){
  ctx.save();circle();ctx.clip();ctx.translate(-i*300,0);draw();ctx.restore();
 }
 // One uninterrupted marquee shared by all three circular display viewports.
 // At 150px high, lettering occupies 50% of each 300px gauge screen.
 const scrollEnd=6.5, fadeInEnd=7.1, logoHoldEnd=11.1, logoFadeEnd=11.8;
 if(t<scrollEnd){
  blackFace();
  sharedViewport(()=>{
   const words='GOLDEN SPEED DYNAMICS';
   ctx.font="400 150px 'GSD Sutro',sans-serif";
   ctx.textAlign='left';ctx.textBaseline='middle';
   // Compress only the scrolling startup lettering vertically, keeping its width.
   ctx.translate(0,150);ctx.scale(1,0.5);ctx.translate(0,-150);
   const w=ctx.measureText(words).width;
   // Travel continuously from fully outside the right gauge to fully outside the left.
   const x=900-(900+w)*(t/scrollEnd);
   ctx.lineJoin='round';ctx.shadowColor='#700000';ctx.shadowBlur=19;
   ctx.fillStyle='#fff';ctx.fillText(words,x,150);
   ctx.shadowBlur=0;ctx.strokeStyle='#000';ctx.lineWidth=2.5;
   ctx.strokeText(words,x,150);ctx.fillText(words,x,150);
  });
  return;
 }
 // Only after the complete text has exited: center logo fades in, holds four
 // full seconds at full opacity, then fades out before the startup gauge sweep.
 if(t<logoFadeEnd){
  blackFace();
  // Stationary logo: no sharedViewport(), scrolling x-coordinate, or translate.
  // Its center is locked to (150,150) in the middle canvas for the whole phase.
  if(i===1){
   const opacity=ease(scrollEnd,fadeInEnd)*(1-ease(logoHoldEnd,logoFadeEnd));
   ctx.save();circle();ctx.clip();ctx.globalAlpha=opacity;
   if(headerStartupLogo.complete && headerStartupLogo.naturalWidth){
    const size=242;
    ctx.drawImage(headerStartupLogo,C-size/2,C-size/2,size,size);
   }else{
    paintGSD(ctx,C,C,3.1);
   }
   ctx.restore();
  }
  return;
 }
 // Gauge sweeps begin after the logo is completely gone.
 const q=clamp01((t-logoFadeEnd)/3);
 const sweep=q<.5?smooth(q*2):smooth((1-q)*2);
 const demo={...v,boost:30*sweep,afr:11+7*sweep,iat:200*sweep,egt:1320*sweep};
 const oldColors=state.colors,oldGreen=state.boostGreen,oldYellow=state.boostYellow,oldRed=state.boostRed,oldLow=state.afrLow,oldHigh=state.afrHigh,oldIat=state.iatWarn,oldEgt=state.egtWarn;
 try{
  state.colors=['#b450ff','#b450ff','#b450ff'];state.boostGreen=30;state.boostYellow=30;state.boostRed=30;state.afrLow=10;state.afrHigh=19;state.iatWarn=250;state.egtWarn=1650;
  gauge(ctx,i,demo,time,true);
  const faceOpacity=ease(11.8,12.25);
  if(faceOpacity<1){ctx.save();ctx.globalAlpha=1-faceOpacity;ctx.fillStyle='#000';circle();ctx.fill();ctx.restore();}

 }finally{state.colors=oldColors;state.boostGreen=oldGreen;state.boostYellow=oldYellow;state.boostRed=oldRed;state.afrLow=oldLow;state.afrHigh=oldHigh;state.iatWarn=oldIat;state.egtWarn=oldEgt;}
}

function readout(label,v,time){const d=GAUGE_DEFS[label]||GAUGE_DEFS['Boost Pressure'];const value=simValue(label,v,time);const pct=clamp((value-d.min)/(d.max-d.min),0,1);const precision=['V','λ','L/h','L/100km','MPG','g/s','gal',':1'].includes(d.unit)?1:0;return {name:label.toUpperCase(),value:Number(value).toFixed(precision),unit:d.unit,pct,min:d.min,max:d.max}}

// Warning configuration belongs to each physical half, and follows its PID when changed.
function splitWarningDef(label){
 const d=GAUGE_DEFS[label]||GAUGE_DEFS['Boost Pressure'];
 if(label==='Boost Pressure')return {kind:'boost',min:0,max:30,step:1,unit:'PSI',values:[15,20,25]};
 if(label==='Air/Fuel Ratio')return {kind:'afr',min:10,max:19,step:.1,unit:':1',values:[12.5,15.5]};
 const span=d.max-d.min,step=span<=10?.1:span<=100?1:span<=500?5:25;
 return {kind:'high',min:d.min,max:d.max,step,unit:d.unit,values:[Math.round((d.min+span*.65)/step)*step,Math.round((d.min+span*.82)/step)*step,Math.round((d.min+span*.94)/step)*step]};
}
function splitWarning(i,side,label){
 const key=i+'-'+side,def=splitWarningDef(label),previous=state.splitWarnings[key];
 if(!previous||previous.pid!==label||!Array.isArray(previous.values)||previous.values.length!==def.values.length){state.splitWarnings[key]={pid:label,values:def.values.slice()};return state.splitWarnings[key]}
 return previous;
}
function splitWarningControls(i,side,label){
 const def=splitWarningDef(label),saved=splitWarning(i,side,label);
 const names=def.kind==='boost'?['GREEN ZONE START','YELLOW ZONE START','RED WARNING START']:def.kind==='afr'?['LOWER WARNING','UPPER WARNING']:['GREEN ZONE START','YELLOW ZONE START','RED WARNING START'];
 let html=`<div class="field"><strong class="title">${side.toUpperCase()} HALF / ${label.toUpperCase()} WARNINGS</strong></div>`;
 names.forEach((name,n)=>{const id=`split-warning-${side}-${n}`;html+=slider(name+' / '+def.unit,id,def.min,def.max,def.step,saved.values[n])});
 return html;
}
const metric=(name,id,unit)=>`<div class="stat"><small>${name} / ${unit}</small><strong id="m-${id}">—</strong></div>`;
const slider=(name,id,min,max,step,value)=>`<div class="field"><div class="line"><label for="${id}">${name}</label><strong class="value" id="v-${id}">${value}</strong></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`;

function syncHoneycomb(){
  document.body.style.backgroundColor='#08090b';
